  <circle cx="60" cy="-20" r="140" fill="#3d1f5c" opacity="0.7"/>

  <!-- Mosaico de aplicaciones -->
  <g transform="translate(96,72)">
    <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
      <rect x="0" y="0" width="76" height="76" rx="18"/>
      <rect x="92" y="0" width="76" height="76" rx="18" fill="#fffade" fill-opacity="0.2"/>
      <rect x="0" y="92" width="76" height="76" rx="18" fill="#fffade" fill-opacity="0.2"/>
      <rect x="92" y="92" width="76" height="76" rx="18"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
