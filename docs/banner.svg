  <text x="330" y="150" font-family="Saira, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="500" fill="#ffffff" letter-spacing="-2">IT<tspan font-weight="700" fill="#fffade">Hub</tspan></text>
  <text x="334" y="204" font-family="Saira, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#efe6f5">Todas las aplicaciones de Intellihelp. Una sola sesi&#243;n.</text>
  <rect x="334" y="232" width="120" height="6" rx="3" fill="#fffade"/>
  <text x="334" y="276" font-family="Saira, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d8c8e6">Google Workspace &#183; OpenID Connect &#183; permisos por aplicaci&#243;n</text>
